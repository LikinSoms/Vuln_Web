<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Northstar Market</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f4f6f8; color: #17202a; }
    main { width: min(420px, calc(100% - 32px)); background: white; border: 1px solid #dfe5ec; border-radius: 8px; padding: 28px; }
    h1 { margin-top: 0; }
    label { display: grid; gap: 7px; margin: 16px 0; font-weight: 700; }
    input { border: 1px solid #c9d3df; border-radius: 6px; padding: 11px; font: inherit; }
    button, a { display: inline-block; border: 0; border-radius: 6px; padding: 11px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
    button { background: #17202a; color: white; }
    a { color: #17202a; background: #e5eaf0; margin-left: 8px; }
    #message { min-height: 22px; color: #8a1f11; }
  </style>
</head>
<body>
  <main>
    <h1>Northstar Market</h1>
    <form id="loginForm">
      <label>
        Username
        <input id="username" name="username" autocomplete="username" required>
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button>Login</button>
      <a href="/register.html">Create Account</a>
      <a href="/">Back to Store</a>
    </form>
    <p id="message"></p>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = document.getElementById("message");
      message.textContent = "";

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value
        })
      });

      const data = await res.json();

      if (!res.ok) {
        message.textContent = data.error || "Login failed.";
        return;
      }

      window.location.href = "/";
    });
  </script>
</body>
</html>
